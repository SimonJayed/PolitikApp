# Local Profile - Persistent Embedded H2 in PostgreSQL Mode
spring.datasource.url=jdbc:h2:file:./data/politikapp;AUTO_SERVER=TRUE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;INIT=RUNSCRIPT FROM 'classpath:db/h2-init.sql'
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.flyway.enabled=false

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
