# ============================================================================
# Supabase Cloud Profile Configuration
# ============================================================================
# Note on Supabase Pooler Ports:
# - Port 5432 (Session Mode): Supports Flyway migrations, transaction locks, and stateful sessions.
#   Recommended if running Flyway migrations directly through Spring Boot.
# - Port 6543 (Transaction Mode): Stateless query pooling. Requires prepareThreshold=0.
# ============================================================================

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:5432/postgres?sslmode=require&prepareThreshold=0&preparedStatementCacheQueries=0&preparedStatementCacheSizeMiB=0&tcpKeepAlive=true&reWriteBatchedInserts=true&connectTimeout=10&socketTimeout=30}
spring.datasource.username=${DATABASE_USERNAME:postgres.xyqkzmeboyucuhfcwtio}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=PolitikAppHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME_MS:300000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
spring.jpa.open-in-view=false

# Flyway Database Migration Configuration
spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:false}
spring.flyway.out-of-order=true
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:5}
spring.flyway.lock-retry-count=${FLYWAY_LOCK_RETRY_COUNT:50}
spring.flyway.postgresql.transactional-lock=false

