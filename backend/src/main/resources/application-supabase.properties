# Supabase Cloud Profile
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://aws-1-ap-southeast-2.pooler.supabase.com:6543/postgres?sslmode=require&prepareThreshold=0}
spring.datasource.username=${DATABASE_USERNAME:postgres.xyqkzmeboyucuhfcwtio}
spring.datasource.password=${DATABASE_PASSWORD:Taptone2025!}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.datasource.hikari.pool-name=PolitikAppHikariPool
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.connection-timeout=${DB_CONNECTION_TIMEOUT_MS:30000}
spring.datasource.hikari.idle-timeout=${DB_IDLE_TIMEOUT_MS:600000}
spring.datasource.hikari.max-lifetime=${DB_MAX_LIFETIME_MS:1800000}
spring.datasource.hikari.keepalive-time=${DB_KEEPALIVE_TIME_MS:300000}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.connection.handling_mode=DELAYED_ACQUISITION_AND_RELEASE_AFTER_TRANSACTION
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.flyway.baseline-on-migrate=${FLYWAY_BASELINE_ON_MIGRATE:true}
spring.flyway.validate-on-migrate=${FLYWAY_VALIDATE_ON_MIGRATE:true}
spring.flyway.connect-retries=${FLYWAY_CONNECT_RETRIES:3}
spring.flyway.lock-retry-count=${FLYWAY_LOCK_RETRY_COUNT:50}
spring.flyway.postgresql.transactional-lock=true
