# Load local credentials from the ignored .env file when present.
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]

# Supabase is the only supported runtime database.
spring.profiles.active=supabase

# General Application Properties
server.port=${PORT:8080}
spring.application.name=backend
# Supabase PostgreSQL datasource
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Actuator Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never

app.news.retrieval-enabled=${NEWS_RETRIEVAL_ENABLED:true}
app.open-congress.enabled=${OPEN_CONGRESS_ENABLED:false}
app.open-congress.import-enabled=${OPEN_CONGRESS_IMPORT_ENABLED:false}
app.open-congress.checkout=${OPEN_CONGRESS_CHECKOUT:}
app.news.scheduled-enabled=${NEWS_SCHEDULED_ENABLED:false}
app.news.approved-hosts=${NEWS_APPROVED_HOSTS:officialgazette.gov.ph,www.officialgazette.gov.ph,www.dost.gov.ph,www.da.gov.ph,pia.gov.ph,senate.gov.ph,www.senate.gov.ph,legacy.senate.gov.ph,www.dbm.gov.ph}
app.ai.enabled=${AI_ENABLED:false}
app.ai.mock-mode=${AI_MOCK_MODE:true}
app.ai.discovery-enabled=${AI_DISCOVERY_ENABLED:false}

# Security
app.security.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}
app.auth.jwt.secret=${JWT_SECRET}

# Rate Limiting
app.rate-limiting.enabled=true
app.rate-limiting.login-limit=60
app.rate-limiting.register-limit=20
app.rate-limiting.submission-limit=30
app.rate-limiting.challenge-limit=30
