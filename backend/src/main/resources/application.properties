# Load local credentials from the ignored .env file when present.
spring.config.import=optional:file:./backend/.env[.properties],optional:file:./.env[.properties]

# Supabase is the only supported runtime database.
spring.profiles.active=supabase

# General Application Properties
server.port=8080
spring.application.name=backend
# Supabase PostgreSQL datasource
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.open-in-view=false
spring.flyway.enabled=${FLYWAY_ENABLED:true}

# Actuator Observability
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# Rate Limiting
app.rate-limiting.enabled=true
app.rate-limiting.login-limit=60
app.rate-limiting.register-limit=20
app.rate-limiting.submission-limit=30
app.rate-limiting.challenge-limit=30