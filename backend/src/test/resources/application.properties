spring.config.import=

spring.datasource.url=jdbc:h2:mem:politikapp_test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;INIT=CREATE SCHEMA IF NOT EXISTS public\\;SET SCHEMA public
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.properties.hibernate.default_schema=public
spring.jpa.open-in-view=false

spring.flyway.enabled=false
spring.sql.init.mode=never

spring.main.banner-mode=off

app.auth.jwt.secret=test-jwt-secret-must-be-at-least-32-characters-long

app.rate-limiting.enabled=true
app.rate-limiting.login-limit=5
app.rate-limiting.register-limit=20
app.rate-limiting.submission-limit=30
app.rate-limiting.challenge-limit=30
