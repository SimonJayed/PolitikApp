spring.config.import=optional:file:./.env[.properties],optional:file:./backend/.env[.properties]

spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=${DB_MAX_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:1}

spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

spring.flyway.enabled=${FLYWAY_ENABLED:true}
spring.sql.init.mode=never

spring.main.banner-mode=off

app.auth.jwt.secret=test-jwt-secret-must-be-at-least-32-characters-long

app.rate-limiting.enabled=true
app.rate-limiting.login-limit=5
app.rate-limiting.register-limit=20
app.rate-limiting.submission-limit=30
app.rate-limiting.challenge-limit=30
